name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    # Windows only: the app drives Windows APIs (ctypes, registry, audio devices).
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements/build.txt
      # Unit and smoke tests with fake models, sound and network. The few that need the real
      # downloaded models skip themselves; the evaluations in tests/eval are run by hand.
      - name: Run tests
        run: python -m pytest -q
