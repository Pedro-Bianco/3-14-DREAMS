name: tests

on:
  push:
    branches: [main]
  pull_request:

# A new commit on a pull request cancels the run still going for the old one; runs on main are
# never cancelled, so every commit there gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    # Windows only: the app drives Windows APIs (ctypes, registry, audio devices).
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements/build.txt
      # Unit and smoke tests with fake models, sound and network. The few that need the real
      # downloaded models skip themselves; the evaluations in tests/eval are run by hand.
      - name: Run tests
        run: python -m pytest -q
