name: Sugerir uma melhoria
description: Um recurso novo ou uma mudança no que o PI já faz.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: O que você quer fazer com o PI
      description: A situação real, com um exemplo fictício do que você diria a ele.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Como imagina que funcione
    validations:
      required: true
  - type: checkboxes
    id: local
    attributes:
      label: Local e grátis
      description: O PI roda no seu computador, sem conta e sem custo.
      options:
        - label: A ideia funciona sem conta, sem chave paga e sem mandar dados pessoais para a nuvem.
